name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Spec engine self-test
        run: npm run uss:test
