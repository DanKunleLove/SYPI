name: Feature request
description: Suggest an idea, a gap rule, or a new hand-off target
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that SYPI makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A question SYPI should ask (gap rule)
        - A new hand-off target / export format
        - MCP tool
        - Canvas / UI
        - Other
